name: Publish Docker image

on:
  push:
    branches: [main]

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read upstream version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=osm-3s_v)[\d.]+' src/Makefile.am)
          [ -n "$VERSION" ] || { echo "Could not parse version from Makefile.am"; exit 1; }
          echo "upstream=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            b1tw153/overpass-api:${{ steps.version.outputs.upstream }}-r${{ github.run_number }}
            b1tw153/overpass-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
